services:

  db_ctv:
    image: mysql:latest
    restart: always
    ports:
      - "${MYSQL_CTV_PORT}:${MYSQL_CTV_PORT}"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_CTV_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_CTV_DATABASE}
      MYSQL_USER: ${MYSQL_CTV_USER}
      MYSQL_PASSWORD: ${MYSQL_CTV_PASSWORD}
      MYSQL_TCP_PORT: ${MYSQL_CTV_PORT}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pctv_django" ]
      interval: 5s
      timeout: 5s
      retries: 10

  ctv:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:${DJANGO_CTV_PORT}"
    ports:
      - "${DJANGO_CTV_PORT}:${DJANGO_CTV_PORT}"
    volumes:
      - ./media:/app/media
    environment:
      - DB_HOST=db_ctv
      - DB_NAME=${MYSQL_CTV_DATABASE}
      - DB_USER=${MYSQL_CTV_USER}
      - DB_PASSWORD=${MYSQL_CTV_PASSWORD}
      - DB_PORT=${MYSQL_CTV_PORT}
      - DJANGO_SECRET_KEY=${DJANGO_CTV_SECRET_KEY}
      - DJANGO_SETTINGS_MODULE=${DJANGO_CTV_SETTINGS_MODULE}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db_ctv:
          condition: service_healthy

volumes:
  mysql_data:
