services:

  db_ctv:
    image: mysql:latest
    restart: always
    ports:
      - "${MYSQL_CTV_PORT}:${MYSQL_CTV_PORT}"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_CTV_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_CTV_DATABASE}
      MYSQL_USER: ${MYSQL_CTV_USER}
      MYSQL_PASSWORD: ${MYSQL_CTV_PASSWORD}
      MYSQL_TCP_PORT: ${MYSQL_CTV_PORT}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping --protocol=TCP -h 127.0.0.1 -P $$MYSQL_TCP_PORT --silent" ]
      interval: 5s
      timeout: 5s
      retries: 10

  ctv:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:${DJANGO_CTV_PORT}"
    ports:
      - "${DJANGO_CTV_PORT}:${DJANGO_CTV_PORT}"
    volumes:
      - ./media:/app/media
      - .:/app
    environment:
      - DB_HOST=db_ctv
      - DB_NAME=${MYSQL_CTV_DATABASE}
      - DB_USER=${MYSQL_CTV_USER}
      - DB_PASSWORD=${MYSQL_CTV_PASSWORD}
      - DB_PORT=${MYSQL_CTV_PORT}
      - DJANGO_SECRET_KEY=${DJANGO_CTV_SECRET_KEY}
      - DJANGO_SETTINGS_MODULE=${DJANGO_CTV_SETTINGS_MODULE}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db_ctv:
          condition: service_healthy

  k6:
    image: grafana/k6:latest
    profiles:
      - load-tests
    environment:
      BASE_URL: ${BASE_URL:-http://ctv:${DJANGO_CTV_PORT}}
      LOAD_TEST_ADMIN_EMAIL: ${LOAD_TEST_ADMIN_EMAIL:-admin@gmail.com}
      LOAD_TEST_ADMIN_PASSWORD: ${LOAD_TEST_ADMIN_PASSWORD:-admin}
      LOAD_TEST_USER_EMAIL: ${LOAD_TEST_USER_EMAIL:-user@gmail.com}
      LOAD_TEST_USER_PASSWORD: ${LOAD_TEST_USER_PASSWORD:-user}
      LOAD_TEST_PACKAGE_ID: ${LOAD_TEST_PACKAGE_ID:-}
      READ_VUS: ${READ_VUS:-1}
      READ_ITERATIONS: ${READ_ITERATIONS:-1}
      THINK_TIME: ${THINK_TIME:-1}
    volumes:
      - ./load-tests:/load-tests:ro
      - ./k6-results:/results
    depends_on:
      ctv:
        condition: service_started

volumes:
  mysql_data:
